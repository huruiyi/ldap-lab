<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无访问权限 · LDAP Auth Service</title>
<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div class="navbar">
    <div class="navbar-inner">
      <a class="brand" th:href="@{/}">🔐 LDAP Auth Service</a>
      <div class="nav">
        <a th:href="@{/}">首页</a>
      </div>
      <div class="nav-right">
        <span th:if="${username}" th:text="${username}"></span>
        <form th:action="@{/logout}" method="post">
          <button type="submit">退出登录</button>
        </form>
      </div>
    </div>
  </div>

  <div class="container narrow">
    <div class="card" style="text-align:center">
      <div style="font-size:48px; margin-bottom:12px">🚫</div>
      <h2>403 · 无访问权限</h2>
      <p class="muted">
        当前账号 <span class="mono" th:text="${username}">user</span> 没有访问此页面的权限。<br>
        该页面需要 <span class="role-tag">ROLE_ADMIN</span> 角色，如需访问请联系管理员在「权限组管理」中授权。
      </p>
      <a class="btn" th:href="@{/}">返回首页</a>
    </div>
  </div>
</body>
</html>
