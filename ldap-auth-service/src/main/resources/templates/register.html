<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · LDAP Auth Service</title>
<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div class="navbar">
    <div class="navbar-inner">
      <a class="brand" th:href="@{/}">🔐 LDAP Auth Service</a>
      <div class="nav">
        <a th:href="@{/}">首页</a>
      </div>
    </div>
  </div>

  <div class="container narrow">
    <div class="card">
      <h2>📝 注册账号</h2>
      <p class="muted" style="margin-bottom:8px">注册后自动加入 user 组，可立即登录</p>

      <div class="msg err" th:if="${err}" th:text="${err}"></div>

      <form th:action="@{/register}" method="POST">
        <label for="username">用户名 *</label>
        <input id="username" type="text" name="username" placeholder="登录用户名" required autofocus />
        <label for="password">密码 *（至少 4 位）</label>
        <input id="password" type="password" name="password" placeholder="密码" required />
        <label for="confirmPassword">确认密码 *</label>
        <input id="confirmPassword" type="password" name="confirmPassword" placeholder="再次输入密码" required />
        <label for="firstName">名字（选填）</label>
        <input id="firstName" type="text" name="firstName" placeholder="如：瑞" />
        <label for="lastName">姓氏（选填）</label>
        <input id="lastName" type="text" name="lastName" placeholder="如：胡" />
        <label for="email">邮箱（选填）</label>
        <input id="email" type="email" name="email" />
        <input type="submit" value="注 册" />
      </form>
    </div>

    <div class="form-foot">已有账号？<a th:href="@{/login}">去登录</a></div>
  </div>
</body>
</html>
