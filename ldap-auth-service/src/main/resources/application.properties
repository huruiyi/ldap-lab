spring.application.name=ldap-auth-service

# Embedded LDAP (UnboundID) is declared in config/EmbeddedLdapConfig —
# it loads data/ldap.ldif first (runtime export), falling back to classpath ldap.ldif
ldap.embedded.port=8389
ldap.embedded.admin-dn=cn=admin,dc=example,dc=com
ldap.embedded.admin-password=admin

# LdapTemplate connection (used by registration / group management; needs write access)
spring.ldap.urls=ldap://localhost:8389
spring.ldap.base=dc=example,dc=com
spring.ldap.username=cn=admin,dc=example,dc=com
spring.ldap.password=admin

# Application LDAP settings (pointing at the embedded server above;
# change providerURL/credentials when connecting to a real LDAP server)
ldap.initialContextFactory=com.sun.jndi.ldap.LdapCtxFactory
ldap.providerURL=ldap://localhost:8389
ldap.authMode=simple
ldap.securityProtocol=
ldap.adminUserName=cn=admin,dc=example,dc=com
ldap.adminPassword=admin
ldap.userSearchBase=ou=users,dc=example,dc=com
ldap.userDn=

# JWT signing key (HS256, at least 32 characters) and token TTL in seconds
jwt.secret=${JWT_SECRET:}
jwt.expires-in=3600
