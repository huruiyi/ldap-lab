<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · Spring Security LDAP</title>
<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div class="navbar">
    <div class="navbar-inner">
      <a class="brand" th:href="@{/}">📂 Spring Security LDAP</a>
      <div class="nav">
        <a th:href="@{/}">首页</a>
        <a th:href="@{/secure}">受保护页</a>
        <a th:href="@{/password}" class="active" th:if="${username != 'anonymous'}">修改密码</a>
        <a th:href="@{/admin/groups}" th:if="${userroles.contains('ROLE_ADMIN')}">权限组管理</a>
      </div>
      <div class="nav-right" th:if="${username != 'anonymous'}">
        <span th:text="${username}">admin</span>
        <form th:action="@{/logout}" method="post" style="margin:0">
          <button type="submit" class="inline danger">退出</button>
        </form>
      </div>
    </div>
  </div>

  <div class="container narrow">
    <div class="card">
      <h2>🔑 修改密码</h2>

      <div class="msg ok" th:if="${ok}" th:text="${ok}"></div>
      <div class="msg err" th:if="${err}" th:text="${err}"></div>

      <form th:action="@{/password}" method="POST">
        <label for="old-password">原密码</label>
        <input id="old-password" type="password" name="oldPassword" required autofocus />
        <label for="new-password">新密码（至少 4 位）</label>
        <input id="new-password" type="password" name="newPassword" minlength="4" required />
        <label for="confirm-password">确认新密码</label>
        <input id="confirm-password" type="password" name="confirmPassword" minlength="4" required />
        <input type="submit" value="修改密码" />
      </form>
    </div>

    <div class="form-foot">密码直接更新到 LDAP 目录（modifyAttributes 写 userPassword）</div>
  </div>
</body>
</html>
