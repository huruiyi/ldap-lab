management.health.ldap.enabled=false

# 内嵌 UnboundID LDAP（SecurityConfig 中的 UnboundIdContainer 加载 users.ldif）
ldap.partitionSuffix=dc=baeldung,dc=com
ldap.url=ldap://localhost:18889

# 目录管理账号（users.ldif 中的 uid=admin 条目），匿名绑定没有写权限，注册用户需要它
ldap.principal=uid=admin,ou=people,dc=baeldung,dc=com
ldap.password=adminpass

# 应用端口
server.port=8080
