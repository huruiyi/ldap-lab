<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · OAuth2 Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #f5f3ff 100%);
      position: relative;
      overflow: hidden;
    }

    /* 背景装饰 */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }
    body::before {
      width: 420px; height: 420px;
      background: rgba(99, 102, 241, 0.18);
      top: -120px; right: -100px;
    }
    body::after {
      width: 360px; height: 360px;
      background: rgba(139, 92, 246, 0.14);
      bottom: -120px; left: -80px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(79, 70, 229, 0.10), 0 1px 3px rgba(15, 23, 42, 0.06);
      padding: 40px 36px 32px;
    }

    .logo {
      width: 60px; height: 60px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }
    .logo svg { width: 30px; height: 30px; }

    h1 {
      text-align: center;
      font-size: 22px;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }

    .alert {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .alert-info {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      color: #1e293b;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .field input::placeholder { color: #cbd5e1; }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.30);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.38);
    }
    .btn:active { transform: translateY(0); }

    .hint {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px dashed #e2e8f0;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.8;
    }
    .hint code {
      background: #eef2ff;
      color: #4f46e5;
      padding: 1px 8px;
      border-radius: 6px;
      font-family: 'Cascadia Code', Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
    </div>
    <h1>OAuth2 Demo</h1>
    <p class="subtitle">授权服务器统一登录</p>

    <div th:if="${param.error != null}" class="alert alert-error">
      <span>⚠</span><span>用户名或密码错误，请重试</span>
    </div>
    <div th:if="${param.logout != null}" class="alert alert-info">
      <span>✓</span><span>已安全退出</span>
    </div>

    <!-- th:action makes Thymeleaf inject the CSRF hidden field automatically -->
    <form method="post" th:action="@{/login}">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn">登 录</button>
    </form>

    <div class="hint">
      演示账号 <code>demo / demo</code> 或 <code>admin / admin</code><br />
      Spring Authorization Server 7.1 · authorization_code + PKCE
    </div>
  </div>
</body>
</html>
