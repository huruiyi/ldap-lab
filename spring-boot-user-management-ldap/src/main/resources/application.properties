server.port=1064
# Spring 6 的 PathPattern 不允许 /**/*.html 这类模式（** 后不能再接路径段），已移除
auth.white-list=${AUTH_WHITELIST:/resources/**,/webjars/**,/*/webjars/**,/authorize/**,/favicon.ico,/error,/,/index.html,/login.html,/register.html,/css/**,/js/**,/v3/api-docs/**,/api/swagger-ui.html,/api/swagger-ui/**,/api/v3/api-docs,/api/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/api/versions/1/login,/api/versions/1/register}


springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.api-docs.path=/api/v3/api-docs


spring.ldap.base=dc=springframework,dc=org
spring.ldap.password=admin
spring.ldap.username=cn=admin,dc=springframework,dc=org
spring.ldap.urls=ldap://localhost:389
spring.data.ldap.repositories.enabled=true

# jjwt 0.12.x 的 HS512 要求密钥 ≥64 字节
app.jwt.secret=${APP_JWT_SECRET:}
# Spring Boot 3 已移除 spring.main.allow-circular-references（本项目也无循环依赖）
