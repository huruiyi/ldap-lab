<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制台 - LDAP 用户管理</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="brand">🔐 LDAP <span>用户管理</span></div>
  <div class="user-area">
    <span id="roles"></span>
    <span id="username"></span>
    <button class="btn-sm" onclick="openPasswordModal()">修改密码</button>
    <button class="btn-sm danger" onclick="logout()">退出登录</button>
  </div>
</nav>

<div class="container">
  <div class="panel">
    <h2>我的会话</h2>
    <p class="desc">当前登录身份与 JWT 信息（无状态认证，Token 10 分钟过期）</p>
    <div class="token-box" id="tokenBox"></div>
  </div>

  <div class="panel" id="userListPanel" style="display:none">
    <h2>用户与角色管理</h2>
    <p class="desc">LDAP 目录 ou=users 下的全部账号（需要 ROLE_ADMIN）。点击角色徽章即可授权 / 撤权，<b>对方重新登录后生效</b>（JWT 无状态，角色签在 Token 里）</p>
    <div id="message" class="message"></div>
    <table>
      <thead>
      <tr><th>用户名</th><th>名字</th><th>姓氏</th><th>角色（点击切换）</th></tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
    <div id="emptyTip" class="empty" style="display:none">暂无用户</div>
  </div>

  <div class="panel">
    <h2>API 文档</h2>
    <p class="desc">查看和调试全部 REST 接口</p>
    <a class="btn-sm" href="/api/swagger-ui.html" target="_blank">打开 Swagger UI →</a>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-mask" id="passwordModal">
  <div class="modal">
    <h3>修改密码</h3>
    <div id="pwdMessage" class="message"></div>
    <div class="form-group">
      <label for="oldPassword">旧密码</label>
      <input type="password" id="oldPassword" autocomplete="current-password" placeholder="请输入当前密码">
    </div>
    <div class="form-group">
      <label for="newPassword">新密码</label>
      <input type="password" id="newPassword" autocomplete="new-password" placeholder="至少 6 位">
    </div>
    <div class="form-group">
      <label for="confirmNewPassword">确认新密码</label>
      <input type="password" id="confirmNewPassword" autocomplete="new-password" placeholder="再次输入新密码">
    </div>
    <div class="actions">
      <button class="btn-sm" onclick="closePasswordModal()">取消</button>
      <button class="btn" id="pwdSubmitBtn" onclick="submitPassword()">确认修改</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
