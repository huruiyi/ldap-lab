<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - LDAP 用户管理</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo">🔐</div>
    <h1>欢迎回来</h1>
    <p class="subtitle">LDAP + JWT 用户管理系统</p>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" required autocomplete="username" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="请输入密码">
      </div>
      <button type="submit" class="btn" id="submitBtn">登 录</button>
    </form>

    <div class="auth-link">还没有账号？<a href="/register.html">立即注册</a></div>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
